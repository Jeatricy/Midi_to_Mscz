[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-to-mscz"
version = "0.4.1"
description = "Turn imperfect, stem-separated MIDI transcriptions into clean MuseScore scores."
requires-python = ">=3.10,<3.12"
dependencies = [
    "mido>=1.3,<2",
]

[project.optional-dependencies]
audio = [
    "basic-pitch==0.4.0",
    "demucs==4.1.0",
]

[project.scripts]
midi-to-mscz = "midi_to_mscz.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
midi_to_mscz = ["web/*.html", "web/*.css", "web/*.js"]
